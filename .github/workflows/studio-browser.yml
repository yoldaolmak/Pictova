name: Studio Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Chromium test dependencies
        run: |
          python -m pip install 'pytest>=7.4' 'Pillow>=10' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Exercise actual Studio UI at desktop and mobile widths
        run: python -m pytest browser_checks/ -q
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-chromium-review
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
