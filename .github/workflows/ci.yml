name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'pictova-isolated-ci' }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        uv pip install pip
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m pip check
        pictova --help
        pictova studio --help
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term

  lint:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'pictova-isolated-ci' }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.12"
        activate-environment: true
    
    - name: Install linters
      run: |
        uv pip install pip
        pip install flake8==7.3.0 black==25.1.0
    
    - name: Run flake8
      run: flake8 src/ --max-line-length=120
    
    - name: Run black check
      run: black --check --line-length 120 src/

    - name: Check Studio JavaScript syntax
      run: node --check src/pictova/app/static/studio.js
