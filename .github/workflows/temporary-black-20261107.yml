# One-time owner-only formatter; delete after successful commit.
name: Temporary Pictova final formatter
on:
  push:
    branches: [quality/lint-cleanup-20261107]
permissions:
  contents: write
jobs:
  source-format:
    if: github.actor == 'yoldaolmak'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited formatter
        run: python -m pip install black==25.1.0
      - name: Apply exact CI formatting
        run: black --line-length 120 src/
      - name: Commit only source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "style: align audited source with pinned Black formatter"
            git push origin HEAD:quality/lint-cleanup-20261107
          fi
