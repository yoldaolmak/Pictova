# One-time owner-only formatter for the isolated quality branch.
# Remove this workflow immediately after the formatting commit.
name: Temporary Pictova source formatter
on:
  push:
    branches: [quality/lint-cleanup-20261107]
permissions:
  contents: write
jobs:
  source-format:
    if: github.actor == 'yoldaolmak'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed formatter versions
        run: python -m pip install black==25.1.0 ruff==0.12.10
      - name: Apply mechanical-only formatting
        run: |
          black --line-length 120 src/
          ruff check src/ --fix --select F541,E231,W293,W391,E401
          black --line-length 120 src/
      - name: Commit changes only on the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "style: mechanically format existing Python sources"
            git push origin HEAD:quality/lint-cleanup-20261107
          fi
