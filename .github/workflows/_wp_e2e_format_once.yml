name: Temporary WordPress E2E Formatting

on:
  push:
    branches:
      - test/synthetic-wordpress-e2e-20261108

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format changed Python files
        run: |
          python -m pip install black==25.1.0
          black --line-length 120 \
            src/services/wordpress.py \
            tests/integration/test_synthetic_wordpress_publish.py \
            tests/unit/test_wordpress_heading_placement.py
      - name: Commit format on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/wordpress.py tests/integration/test_synthetic_wordpress_publish.py \
            tests/unit/test_wordpress_heading_placement.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format synthetic WP end-to-end tests and heading fix"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
