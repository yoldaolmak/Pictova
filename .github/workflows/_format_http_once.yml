name: Temporary HTTP and Studio formatting

on:
  push:
    branches:
      - refactor/review-http-studio-boundaries-20261108

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format changed source using CI-pinned Black
        run: |
          python -m pip install black==25.1.0
          black --line-length 120 src/pictova/app/server.py src/pictova/app/studio.py
      - name: Commit formatting on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pictova/app/server.py src/pictova/app/studio.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format local HTTP and Studio helpers"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
