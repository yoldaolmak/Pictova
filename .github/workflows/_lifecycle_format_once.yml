name: Temporary Lifecycle Formatting

on:
  push:
    branches:
      - fix/implicit-state-lifecycles-20261107

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format modified Python code with pinned Black
        run: |
          python -m pip install black==25.1.0
          black --line-length 120 \
            src/pictova/app/state.py \
            src/pictova/app/studio.py \
            src/pictova/engine/publish_outcome.py \
            src/pictova/engine/attach.py \
            src/pictova/engine/processor.py \
            src/services/post_media_guard.py \
            src/services/wordpress.py \
            src/main.py \
            scripts/fast_scan.py \
            tests/unit/test_state_lifecycles.py \
            tests/unit/test_studio.py \
            tests/unit/test_post_media_guard.py \
            tests/integration/test_cli_contract.py
      - name: Commit formatter result on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pictova/app/state.py src/pictova/app/studio.py \
            src/pictova/engine/publish_outcome.py src/pictova/engine/attach.py \
            src/pictova/engine/processor.py src/services/post_media_guard.py \
            src/services/wordpress.py src/main.py scripts/fast_scan.py \
            tests/unit/test_state_lifecycles.py tests/unit/test_studio.py \
            tests/unit/test_post_media_guard.py tests/integration/test_cli_contract.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Black to lifecycle fixes"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
