name: Temporary Studio Format

on:
  push:
    branches:
      - feat/studio-reviewed-visual-workflow-20261107

permissions:
  contents: write

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format exactly the touched Python sources
        run: |
          python -m pip install black==25.1.0
          black --line-length 120 src/pictova/app/studio.py src/pictova/app/server.py src/pictova/engine/attach.py
      - name: Commit formatter output on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pictova/app/studio.py src/pictova/app/server.py src/pictova/engine/attach.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply pinned Black to Studio sources"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
